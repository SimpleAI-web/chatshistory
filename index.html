<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        /* Обнуляем внешние и внутренние отступы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Настраиваем отображение на всю высоту экрана */
        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }

        /* Центрируем контент с помощью Flexbox */
        body {
            display: flex;
            justify-content: center; /* Центрирование по горизонтали */
            align-items: center;     /* Центрирование по вертикали */
            text-align: center;      /* Выравнивание самого текста по центру */
            padding: 20px;
        }

        /* Контейнер для текста, чтобы ограничить максимальную ширину */
        .content {
            max-width: 600px;
            width: 100%;
        }

        /* Стили для заголовка */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Стили для основного текста */
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Здарова</h1>
        <p>А че, сайт закрыт если нужен доступ писать знаете куда)</p>
    </div>

</body>
</html>
